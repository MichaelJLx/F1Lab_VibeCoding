<!doctype html><html><head><meta charset="utf-8"><title>RB22 active wing comparison</title><style>body{margin:0;background:#f7f5f0;font:14px sans-serif}header{height:48px;display:flex;align-items:center;gap:12px;padding:0 20px}button{padding:6px 12px}#labels{position:absolute;top:65px;left:0;width:100%;display:flex;pointer-events:none}#labels b{width:50%;text-align:center}canvas{display:block;width:100vw;height:calc(100vh - 48px)}</style></head><body><header><button id="front">Front</button><button id="rear">Rear</button><button id="side">Side</button><button id="frontWing">Front wing close-up</button><button id="rearWing">Rear wing close-up</button><button id="animate">Animate</button><span id="status">Loading</span></header><div id="labels"><b>基础模式</b><b>直道模式</b></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {splitFlap,setFlap} from '/src/scene/vehicle/ActiveWings.ts';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const env=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;
const camera=new T.PerspectiveCamera(35,1,.02,100),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const scenes=[new T.Scene(),new T.Scene()],rigs=[];let animating=false,start=0;
const source=(await new GLTFLoader().loadAsync('/vehicles/rb22/model.glb')).scene;
for(const scene of scenes){scene.background=new T.Color('#e6e3dd');scene.environment=env;const car=source.clone(true);car.traverse(o=>{if(o.isMesh)o.geometry=o.geometry.clone();});scene.add(car);rigs.push(['front-wing','rear-wing'].map((n,i)=>splitFlap(car.getObjectByName(n),i===0)));scene.add(new T.HemisphereLight(0xffffff,0x777777,2));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,6,5);scene.add(light);}
function view(pos,target){camera.position.fromArray(pos);controls.target.fromArray(target);controls.update();}
const views={front:[[1.5,1.5,7],[0,.45,0]],rear:[[-1.6,1.7,-7],[0,.45,-.2]],side:[[6,1.5,0],[0,.45,0]],frontWing:[[1.3,1.1,4.3],[0,.25,2.5]],rearWing:[[1.3,1.5,-4],[0,.8,-2.2]]};for(const [id,args] of Object.entries(views))document.querySelector('#'+id).onclick=()=>view(...args);view(...views.front);
document.querySelector('#animate').onclick=()=>{animating=!animating;start=performance.now();};document.querySelector('#status').textContent='Ready — drag to orbit';
function frame(t){const w=innerWidth,h=innerHeight-48;renderer.setSize(w,h,false);camera.aspect=w/2/h;camera.updateProjectionMatrix();controls.update();const travel=animating?Math.min(1,Math.max(0,((t-start)%2000<1000?((t-start)%2000)/300:(2000-(t-start)%2000)/300))):1;for(const rig of rigs[1])setFlap(rig,travel*travel*(3-2*travel));renderer.setScissorTest(true);scenes.forEach((scene,i)=>{renderer.setViewport(i*w/2,0,w/2,h);renderer.setScissor(i*w/2,0,w/2,h);renderer.render(scene,camera);});requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.addEventListener('error',e=>document.querySelector('#status').textContent=e.message);
</script></body></html>
